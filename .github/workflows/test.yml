name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test

  browser:
    name: Python and Chromium regressions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: npm ci --no-audit --no-fund
      - run: python3 -m pip install -r requirements-test.txt
      - name: Install audio regression tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - run: npm run test:python
      - run: python3 -m playwright install --with-deps chromium
      - run: npm run test:browser:smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-regression-reports
          path: test-results/browser-smoke/
          if-no-files-found: ignore
          retention-days: 7
