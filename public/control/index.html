<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101319"><title>ACAHKU · Broadcast control</title><link rel="stylesheet" href="./control.css"><link rel="stylesheet" href="./production.css"></head>
<body class="phi-app">
  <div class="ambient" aria-hidden="true"></div>
  <header class="app-header"><a class="wordmark" href="./">ACA<span>HKU</span><i></i></a><div class="header-caption">Broadcast control</div><div class="connection" id="connection" role="status"><span class="dot"></span>Connecting</div></header>
  <section id="pairing" class="pairing" hidden>
    <div class="pair-art"><img src="../assets/event/signal.svg" alt="ACAHKU rhythm artwork"></div>
    <div class="pair-copy"><h1>Control access</h1><form id="pair-form"><label for="pin">Pairing code</label><input id="pin" name="pin" type="password" autocomplete="current-password" inputmode="numeric" required placeholder="Code from broadcast laptop"><button class="phi-surface phi-button is-primary" type="submit">Connect →</button></form><div id="pair-error" class="error" role="alert"></div><p class="secondary"><a href="../scorekeeper/">計分員登入 →</a></p></div>
  </section>
  <div id="workspace" hidden>
    <nav class="tabs phi-tabs" aria-label="Control sections">
      <button class="phi-surface" data-tab="broadcast" aria-selected="true">Live production</button>
      <button class="phi-surface" data-tab="qualifiers" aria-selected="false">Qualifiers</button>
      <button class="phi-surface" data-tab="bracket" aria-selected="false">Bracket</button>
      <button class="phi-surface" data-tab="songs" aria-selected="false">Song selection</button>
      <button class="phi-surface" data-tab="event" aria-selected="false">Event & library</button>
    </nav>
    <main id="content"></main>
    <footer class="app-footer"><span id="sync-status" role="status">Waiting for server</span></footer>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="../socket.io/socket.io.js"></script><script src="../js/score-rules.js"></script><script src="../js/qualifier-rules.js"></script><script src="../js/song-pool.js"></script><script src="../js/competition-config.js"></script><script src="../js/final-sequence.js"></script><script src="../js/common.js"></script><script src="../js/socket.js"></script><script src="../js/motion.js"></script><script src="../js/countdown.js"></script><script src="../js/display-media.js"></script><script src="../js/media-warmup.js"></script><script src="../js/final-announcement.js"></script><script src="../js/draft-storage.js"></script><script src="./control.js"></script>
</body></html>
